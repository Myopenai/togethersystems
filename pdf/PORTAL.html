    // ============================================
    // FUNKTIONEN
    // ============================================
    
    let currentFilter = 'all';
    let currentSearch = '';

    function getFileExtension(filename) {
      return filename.split('.').pop().toLowerCase();
    }

    function getFileType(filename) {
      const ext = getFileExtension(filename);
      const typeMap = {
        'html': 'HTML',
        'md': 'Markdown',
        'ps1': 'PowerShell',
        'py': 'Python',
        'json': 'JSON',
        'js': 'JavaScript',
        'txt': 'Text'
      };
      return typeMap[ext] || ext.toUpperCase();
    }

    function matchesSearch(file, search) {
      if (!search) return true;
      const searchLower = search.toLowerCase();
      return file.name.toLowerCase().includes(searchLower) ||
             file.description.toLowerCase().includes(searchLower) ||
             file.tags.some(tag => tag.toLowerCase().includes(searchLower));
    }

    function matchesFilter(file, filter) {
      if (filter === 'all') return true;
      if (filter === file.type) return true;
      if (filter === file.category) return true;
      return false;
    }

    function updateStats() {
      const visible = files.filter(f => matchesSearch(f, currentSearch) && matchesFilter(f, currentFilter));
      const stats = {
        total: visible.length,
        html: visible.filter(f => f.type === 'html').length,
        md: visible.filter(f => f.type === 'md').length,
        ps1: visible.filter(f => f.type === 'ps1').length,
        py: visible.filter(f => f.type === 'py').length
      };
      
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statHTML').textContent = stats.html;
      document.getElementById('statMD').textContent = stats.md;
      document.getElementById('statPS1').textContent = stats.ps1;
      document.getElementById('statPY').textContent = stats.py;
    }

    function renderFiles() {
      const visible = files.filter(f => matchesSearch(f, currentSearch) && matchesFilter(f, currentFilter));
      
      // Gruppiere nach Typ
      const grouped = {};
      visible.forEach(file => {
        const type = file.type;
        if (!grouped[type]) grouped[type] = [];
        grouped[type].push(file);
      });

      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      const typeLabels = {
        'html': 'HTML Anwendungen',
        'md': 'Dokumentationen',
        'ps1': 'PowerShell Scripts',
        'py': 'Python Scripts',
        'json': 'Konfigurationen',
        'js': 'JavaScript',
        'txt': 'Text Dateien'
      };

      Object.keys(grouped).sort().forEach(type => {
        const category = document.createElement('div');
        category.className = 'category';
        
        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `
          <h2>${typeLabels[type] || type.toUpperCase()}</h2>
          <span class="count">${grouped[type].length}</span>
        `;
        category.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'file-grid';
        
        grouped[type].forEach(file => {
          const card = document.createElement('div');
          card.className = 'file-card';
          card.innerHTML = `
            <div class="icon">${file.icon}</div>
            <div class="title">${file.name}</div>
            <div class="description">${file.description}</div>
            <div class="meta">
              <span class="type">${getFileType(file.name)}</span>
              <a href="${file.name}" class="link" target="_blank">Öffnen →</a>
            </div>
          `;
          grid.appendChild(card);
        });
        
        category.appendChild(grid);
        container.appendChild(category);
      });

      if (visible.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <div>Keine Dateien gefunden</div>
            <div style="font-size: 11px; margin-top: 10px; opacity: 0.7;">
              Versuche andere Suchbegriffe oder Filter
            </div>
          </div>
        `;
      }

      updateStats();
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderFiles();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderFiles();
      });
    });

    // Initialisierung
    renderFiles();
  </script>
</body>
</html>
