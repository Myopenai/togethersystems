<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown CMS Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .file-item {
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 0.25rem;
            color: #333;
        }
        .file-item:hover {
            background: #f1f1f1;
        }
        .file-item.active {
            background: #e9ecef;
            font-weight: bold;
        }
        #preview {
            padding: 1rem;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            min-height: 400px;
            overflow-y: auto;
        }
        #editor {
            min-height: 400px;
            width: 100%;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Markdown CMS</a>
            <div class="d-flex align-items-center">
                <button id="export-html" class="btn btn-outline-light ms-2">Export HTML</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Files</span>
                        <button id="refresh-files" class="btn btn-sm btn-outline-secondary">↻</button>
                    </div>
                    <div class="card-body p-0">
                        <div id="files-list" class="list-group list-group-flush">
                            <div class="text-muted text-center py-3">Loading files...</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="mb-3">
                    <div class="input-group mb-3">
                        <span class="input-group-text">File Name</span>
                        <input type="text" id="file-name" class="form-control" placeholder="example.md">
                        <button id="save-file" class="btn btn-primary">Save</button>
                    </div>
                    <textarea id="editor" placeholder="Start writing your markdown here..."></textarea>
                </div>
                <div class="card">
                    <div class="card-header">Preview</div>
                    <div id="preview" class="card-body">
                        <p class="text-muted">Preview will appear here</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.3/dist/purify.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="src/js/search.js"></script>
    <script src="src/js/wysiwyg.js"></script>
    <script src="src/js/editor.js"></script>
    <script src="src/js/main.js"></script>
    
    <!-- Initialize the application -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize marked.js
            marked.setOptions({
                gfm: true,
                breaks: true,
                smartLists: true,
                smartypants: true
            });
            
            // Initialize the editor
            if (typeof MarkdownEditor !== 'undefined') {
                window.markdownEditor = new MarkdownEditor();
            }
            
            // Initialize search if available
            if (typeof initSearch === 'function') {
                initSearch();
            }
        });
    </script>
</body>
</html>
