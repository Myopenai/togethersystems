# Nginx Gateway - Control Service Endpoints
# BRANDING: .T. TogetherSystems - ModularFlux Architecture
# VERSION: 3.0.0

server {
    listen 443 ssl;
    server_name apple-pi.local;

    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    # Public Endpoints
    location /public/ {
        proxy_pass http://portal:8080;
    }

    # Manifest Endpoints
    location /manifest/ {
        proxy_pass http://portal:8080;
    }

    # Verify Endpoints (optional mTLS)
    location /verify/ {
        proxy_pass http://portal:8080;
        ssl_verify_client optional;
        if ($ssl_client_verify = "SUCCESS") {
            add_header X-Client-Cert "ok";
        }
    }

    # Control Service Endpoints
    location /healthz {
        proxy_pass http://control:8090/healthz;
    }

    location /readyz {
        proxy_pass http://control:8090/readyz;
    }

    location /status {
        proxy_pass http://control:8090/status;
    }

    # Ruhestand/Aktiv Endpoints
    location /ruhestand {
        proxy_pass http://control:8090/mode/ruhestand;
        limit_except POST {
            deny all;
        }
    }

    location /aktiv {
        proxy_pass http://control:8090/mode/aktiv;
        limit_except POST {
            deny all;
        }
    }
}
