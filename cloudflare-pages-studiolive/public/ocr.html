<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>OCR Upload · TogetherSystems</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/osoto.css">
  <script src="https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <script src="../../console-monitor.js"></script>
  <script src="../../http-resource-monitor-browser.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="logo"><span class="brand">.T.</span> TogetherSystems <span style="color:#39d0ff">OCR</span></div>
      <div class="top-right"><button class="btn btn-outline" onclick="location.href='/'">Zurück</button></div>
    </header>
    <aside class="sidenav"><nav class="nav"><div class="nav-label">Bereiche</div><a href="/" class="nav-item">Portal</a><a href="/downloads/" class="nav-item">Downloads</a></nav></aside>
    <main class="main">
      <section class="header"><div><h1>Kassenbon/DIN‑A4 Upload</h1><p class="muted">Foto auswählen, OCR läuft, Text & Felder werden automatisch analysiert.</p></div></section>
      <section class="card">
        <input id="file" type="file" accept="image/*,application/pdf">
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-primary" onclick="doUpload()">Upload + Server‑Register</button>
          <button class="btn btn-outline" onclick="runOCR()">Browser‑OCR (Fallback)</button>
          <button class="btn btn-outline" onclick="sendAnalysis()">Analyse ausführen</button>
        </div>
        <h3 style="margin-top:12px">OCR‑Text</h3>
        <pre id="ocrText" style="max-height:220px;overflow:auto"></pre>
        <h3>Analyse‑Report</h3>
        <pre id="report" style="max-height:260px;overflow:auto"></pre>
      </section>
    </main>
  </div>
  <script>
    const BASE_URL = window.location.origin || 'https://myopenai.github.io/togethersystems';
    let lastDoc = null;
    let lastText = '';
    
    async function doUpload(){
      const f = document.getElementById('file').files[0];
      if(!f){ alert('Datei wählen'); return; }
      const form = new FormData(); form.append('file', f);
      const res = await fetch(`${BASE_URL}/api/ocr/upload`, { method:'POST', body: form });
      const j = await res.json();
      if(!j.ok){ alert('Upload fehlgeschlagen'); return; }
      lastDoc = j.doc;
      document.getElementById('report').textContent = JSON.stringify(j, null, 2);
    }
    
    async function runOCR(){
      const f = document.getElementById('file').files[0];
      if(!f){ alert('Datei wählen'); return; }
      const { createWorker } = Tesseract;
      const worker = await createWorker();
      await worker.loadLanguage('deu');
      await worker.initialize('deu');
      const img = URL.createObjectURL(f);
      const { data: { text, confidence } } = await worker.recognize(img);
      await worker.terminate();
      lastText = text;
      document.getElementById('ocrText').textContent = text + `\n\n[confidence=${confidence}]`;
    }
    
    async function sendAnalysis(){
      if(!lastText){ alert('Erst OCR durchführen (Browser) oder Text eingeben.'); return; }
      const res = await fetch(`${BASE_URL}/api/ocr/analyze`, {
        method:'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ ocrText: lastText, language: 'de', confidence: 0.7 })
      });
      const j = await res.json();
      document.getElementById('report').textContent = JSON.stringify(j, null, 2);
    }
  </script>
</body>
</html>
