  <script>
    // Portal öffnen
    function openPortal() {
      const overlay = document.getElementById('portal-overlay');
      const loading = document.getElementById('loading');
      const iframe = document.getElementById('nebula-iframe');
      
      // Zeige Loading
      loading.classList.add('active');
      
      // Warte kurz, dann verstecke Overlay
      setTimeout(() => {
        overlay.classList.add('hidden');
        
        // Stelle sicher, dass iframe fokussiert ist
        iframe.focus();
        
        // Optional: Vollbild-Modus aktivieren
        if (iframe.requestFullscreen) {
          iframe.requestFullscreen().catch(err => {
            console.log('Fullscreen nicht verfügbar:', err);
          });
        }
      }, 500);
    }
    
    // Auto-Start nach 3 Sekunden (optional)
    let autoStartTimer = null;
    
    function enableAutoStart() {
      autoStartTimer = setTimeout(() => {
        openPortal();
      }, 3000);
    }
    
    // Auto-Start deaktivieren bei Mausbewegung oder Klick
    document.addEventListener('mousemove', () => {
      if (autoStartTimer) {
        clearTimeout(autoStartTimer);
        autoStartTimer = null;
      }
    });
    
    document.addEventListener('click', () => {
      if (autoStartTimer) {
        clearTimeout(autoStartTimer);
        autoStartTimer = null;
      }
    });
    
    // Optional: Auto-Start aktivieren (auskommentiert)
    // enableAutoStart();
    
    // Keyboard Shortcut: ESC zum Zurückkehren zum Overlay
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const overlay = document.getElementById('portal-overlay');
        overlay.classList.remove('hidden');
      }
    });
    
    // Prüfe ob iframe geladen ist
    const iframe = document.getElementById('nebula-iframe');
    iframe.addEventListener('load', () => {
      console.log('Heilungsspirale Pro geladen');
    });
    
    iframe.addEventListener('error', () => {
      console.error('Fehler beim Laden der Heilungsspirale Pro');
      document.getElementById('loading').textContent = 'Fehler: Datei nicht gefunden. Bitte prüfe den Pfad.';
    });
  </script>
