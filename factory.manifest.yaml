# [.SYSTEMS.T.SYSTEMS.] Factory Manifest - Single Source of Truth
# Console-Bypass Integration für maximalen Durchsatz

project: togethersystems
version: 1.0.0
brand: "[.SYSTEMS.T.SYSTEMS.]"

modules:
  - name: portal-start
    language: html
    path: "Portal – Start.html"
    pipeline: [generate, build, test, package, publish]
    dependencies: []
    
  - name: kassenbuch
    language: html
    path: "CASHFLOX/Kassenbuch/kassenbuch.html"
    pipeline: [generate, build, test, package, publish]
    dependencies: ["communication-layer"]
    
  - name: chflox
    language: html
    path: "CASHFLOX/chflox.html"
    pipeline: [generate, build, test, package, publish]
    dependencies: ["communication-layer", "ocr-pipeline"]
    
  - name: budget
    language: html
    path: "CASHFLOX/budget.html"
    pipeline: [generate, build, test, package, publish]
    dependencies: ["communication-layer"]
    
  - name: contract
    language: html
    path: "CASHFLOX/contract.html"
    pipeline: [generate, build, test, package, publish]
    dependencies: ["communication-layer"]
    
  - name: flowcashx
    language: html
    path: "CASHFLOX/FLOCASHX.HTML"
    pipeline: [generate, build, test, package, publish]
    dependencies: ["communication-layer"]
    
  - name: communication-layer
    language: js
    path: "CASHFLOX/KASSENBUCH-COMMUNICATION-LAYER.js"
    pipeline: [generate, build, test, package]
    dependencies: []
    
  - name: ocr-pipeline
    language: js
    runtime: cloudflare-pages
    path: "cloudflare-pages-studiolive/functions/api/ocr"
    pipeline: [generate, build, test, publish]
    dependencies: []
    
  - name: api-voucher
    language: js
    runtime: cloudflare-pages
    path: "cloudflare-pages-studiolive/functions/api/voucher"
    pipeline: [generate, build, test, publish]
    dependencies: []
    
  - name: robotics
    language: js
    runtime: cloudflare-pages
    path: "cloudflare-pages-studiolive/functions/api/robotics"
    pipeline: [generate, build, test, publish]
    dependencies: []

policies:
  retries:
    default:
      attempts: 3
      backoff: exponential
      maxDelayMs: 30000
    ocr:
      attempts: 2
      backoff: linear
      maxDelayMs: 10000
    api:
      attempts: 5
      backoff: exponential
      maxDelayMs: 60000
      
  autofix:
    enabled: true
    ruleset: default
    confidenceThreshold: 0.8
    
  gates:
    requireTestsGreen: true
    requireSbom: false
    requireChecksums: true
    
  console:
    bypass: true
    errorLevels: [error, warning, info]
    telemetry: true

telemetry:
  errorBus: "local://error-bus"
  auditSink: "local://audit-log"
  console:
    enabled: true
    prefix: "[FABRIKAGE]"
    levels: [error, warning, info, debug]

slo:
  buildTimeMs: 600000
  successRate: 0.99
  maxRollbackMs: 120000
  ocrProcessingMs: 30000
  apiResponseMs: 5000

audit:
  enabled: true
  chain: [manifest, plan, events, fixes, artifacts, deploy]
  signing: true
  checksums: [sha256]
