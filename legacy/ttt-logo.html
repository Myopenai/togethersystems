<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTT Logo - TogetherSystems</title>
    <link rel="stylesheet" href="ttt-logo.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .demo-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(57, 208, 255, 0.3);
        }
    </style>
  <script src="../../console-monitor.js"></script>
  <script src="../../http-resource-monitor-browser.js"></script>

  <link rel="stylesheet" href="../../css/teladia-complete-design-system.css">
</head>
<body>
    <div class="demo-container">
        <a href="https://github.com/Myopenai" class="ttt-logo-container" target="_blank">
            <div class="ttt-logo">
                <!-- Stars -->
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                
                <!-- Arcs -->
                <div class="arc-top"></div>
                <div class="arc-bottom"></div>
                
                <!-- TTT Text -->
                <div class="ttt-text">TTT</div>
                
                <!-- German Phrase -->
                <div class="german-phrase">
                    Wer nicht will, macht nicht – T<span class="subscript">m</span>, T<span class="subscript">e</span>, & T<span class="subscript">a</span>
                </div>
            </div>
        </a>
        
        <div class="ttt-branding">
            <div class="brand-name">.T. TogetherSystems</div>
            <a href="https://github.com/Myopenai" class="brand-url" target="_blank">https://github.com/Myopenai</a>
            <div class="brand-tagline">Fabriquations Software Automatizations Productions Industrial Software Products</div>
        </div>
    </div>
</body>
</html>
