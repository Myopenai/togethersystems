<!DOCTYPE html>
<html>
<head>
    <title>OSOSOS Offline Version</title>
    <style>
        iframe { width: 100%; height: 100vh; border: none; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <iframe src="OSOSOS-COMPLETE-OFFLINE-OS.html"></iframe>
    <script>
        // Block any Git-related scripts
        window.addEventListener('error', function(e) {
            if (e.message.includes('git') || e.message.includes('commit')) {
                e.preventDefault();
                console.log('Blocked Git-related error:', e.message);
            }
        }, true);
    </script>
</body>
</html>
