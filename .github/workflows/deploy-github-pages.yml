name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        working-directory: ./docs/multi-industry-docs
        run: |
          npm ci --prefer-offline --no-audit
      
      - name: Build project
        working-directory: ./docs/multi-industry-docs
        run: |
          npm run build
      
      - name: Verify build output
        working-directory: ./docs/multi-industry-docs
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            ls -la
            exit 1
          fi
          echo "Build output:"
          ls -la dist/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/multi-industry-docs/dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

