global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'slack-notifications'
  routes:
    - match:
        severity: 'critical'
      receiver: 'slack-critical'
    - match:
        severity: 'warning'
      receiver: 'slack-warning'

receivers:
- name: 'slack-notifications'
  slack_configs:
  - channel: '#alerts'
    send_resolved: true
    title: '{{ template "slack.gotify.title" . }}'
    text: '{{ template "slack.gotify.text" . }}'
    color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    
- name: 'slack-critical'
  slack_configs:
  - channel: '#alerts-critical'
    send_resolved: true
    title: '🚨 CRITICAL: {{ .CommonLabels.alertname }}'
    text: '{{ range .Alerts }}*Alert:* {{ .Annotations.summary }}
*Description:* {{ .Annotations.description }}
*Severity:* {{ .Labels.severity }}
*Status:* {{ .Status | toUpper }}
*Starts at:* {{ .StartsAt }}
{{ end }}'
    color: 'danger'

- name: 'slack-warning'
  slack_configs:
  - channel: '#alerts-warning'
    send_resolved: true
    title: '⚠️ WARNING: {{ .CommonLabels.alertname }}'
    text: '{{ range .Alerts }}*Alert:* {{ .Annotations.summary }}
*Description:* {{ .Annotations.description }}
*Severity:* {{ .Labels.severity }}
*Status:* {{ .Status | toUpper }}
*Starts at:* {{ .StartsAt }}
{{ end }}'
    color: 'warning'
