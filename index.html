<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CognitiveFabric — Single-file ES2022</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b1220; --fg: #e6edf3; --accent: #4aa3ff; --muted: #9aa4b2;
      --panel: #141b2d; --ok: #3ecf8e; --warn: #ffd966; --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #223; background: #0e1526; position: sticky; top: 0; }
    .brand { font-weight: 600; letter-spacing: 0.3px; }
    .btn { background: var(--accent); color: #081224; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 12px; padding: 12px; }
    .panel { background: var(--panel); border-radius: 10px; padding: 12px; }
    .panel h3 { margin: 0 0 8px 0; font-size: 16px; }
    .small { font-size: 12px; color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; }
    .input, textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334; background: #0e1628; color: var(--fg); }
    .list { display: grid; gap: 8px; }
    .item { background: #0e1526; border: 1px solid #233; border-radius: 8px; padding: 8px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #172038; color: var(--muted); font-size: 11px; }
    .ok { background: var(--ok); color: #081224; }
    .warn { background: var(--warn); color: #081224; }
    .err { background: var(--err); color: #081224; }
    canvas { background: #0e1628; border-radius: 8px; }
    .footer { text-align: center; padding: 16px; color: var(--muted); }
    /* Utility */
    .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
    .mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; }
    .w100 { width: 100%; } .w50 { width: 50%; }
  </style>
  <!-- Optional: Chart.js CDN (comment in to enable charts)
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  -->
  <link rel="stylesheet" href="css/teladia-complete-design-system.css" />
  <!-- T,.&T,,.&T,,,.].T,,,,.(C)(R).T,,.} - TEL1.NL - Together Systems -->
  <!-- T,.&T,,.&T,,,.].T,,,,.(C)(R).T,,.} - TEL1.NL - Together Systems -->
</head>
<body>
  <div class="topbar">
    <div class="brand">CognitiveFabric • ES2022 • Single-file</div>
    <div class="row">
      <button id="btnSeed" class="btn">Seed events</button>
      <button id="btnClear" class="btn">Clear</button>
    </div>
  </div>
  <div class="grid">
    <div class="panel">
      <h3>Body state</h3>
      <div class="small">Interoception (continuous variables)</div>
      <div class="mt12 list">
        <label>Bladder pressure <input id="bsBladder" class="input" type="range" min="0" max="1" step="0.01" value="0.2" /></label>
        <label>Bowel pressure <input id="bsBowel" class="input" type="range" min="0" max="1" step="0.01" value="0.2" /></label>
        <label>Nasal patency <input id="bsNasal" class="input" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
        <label>Pain index <input id="bsPain" class="input" type="range" min="0" max="1" step="0.01" value="0.1" /></label>
        <label>Muscle relaxation <input id="bsRelax" class="input" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
        <label>Arousal level <input id="bsArousal" class="input" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
      </div>
      <h3 class="mt16">Perception</h3>
      <div class="row mt8">
        <input id="symbols" class="input" placeholder="Symbols (comma-separated): dog, park" />
        <button id="btnPerceive" class="btn">Perceive</button>
      </div>
      <div class="small mt8">Embeddings simulated; plug-in real models later.</div>
      <h3 class="mt16">Language render</h3>
      <div class="row mt8">
        <textarea id="prompt" rows="3" placeholder="Describe active workspace..." class="w100"></textarea>
      </div>
      <div class="row mt8">
        <button id="btnRender" class="btn">Render</button>
      </div>
      <div id="renderOut" class="mt8 small"></div>
    </div>
    <div class="panel">
      <h3>Workspace (active events)</h3>
      <div class="list mt8" id="wsList"></div>
      <h3 class="mt16">Emotion snapshot</h3>
      <div class="row small mt8" id="emoRow"></div>
      <h3 class="mt16">Charts (optional)</h3>
      <canvas id="chart" height="140"></canvas>
    </div>
  </div>
  <div class="footer">© CognitiveFabric • Single-file ES2022 • No bundler</div>
  <script type="module">
    // Core data types (immutable events)
    const nowIso = () => new Date().toISOString();
    const clamp01 = x => Math.max(0, Math.min(1, x));
    const uuid = () => crypto.randomUUID();

    class EmotionState {
      constructor({ valence = 0, arousal = 0, anger = 0, fear = 0, joy = 0, sadness = 0, surprise = 0 } = {}) {
        Object.assign(this, { valence, arousal, anger, fear, joy, sadness, surprise });
        Object.freeze(this);
      }
    }

    class BodyState {
      constructor({ bladderPressure = 0, bowelPressure = 0, nasalPatency = 1, painIndex = 0, muscleRelaxation = 0.5, arousalLevel = 0.3 } = {}) {
        Object.assign(this, { bladderPressure, bowelPressure, nasalPatency, painIndex, muscleRelaxation, arousalLevel });
        Object.freeze(this);
      }
    }

    class CognitiveEvent {
      constructor({ type, contentVector = [], symbols = [], sourceModule, emotionState, bodyState, relevanceScore = 0.5, trace = [] } = {}) {
        Object.assign(this, {
          id: uuid(),
          timestamp: nowIso(),
          type,
          contentVector,
          symbols,
          sourceModule,
          emotionState,
          bodyState,
          relevanceScore,
          trace
        });
        Object.freeze(this);
      }
    }

    class GlobalWorkspace {
      constructor({ maxItems = 32 } = {}) {
        this.maxItems = maxItems;
        this._items = [];
      }
      write(event) {
        this._items.push(event);
        this._items.sort((a, b) => b.relevanceScore - a.relevanceScore);
        if (this._items.length > this.maxItems) this._items.length = this.maxItems;
      }
      clear() { this._items.length = 0; }
      readActive() { return [...this._items]; }
    }

    // Emotion computation (placeholder)
    const computeEmotion = (body, contextSymbols) => {
      const valence = clamp01(1.0 - body.painIndex - 0.5 * Math.max(body.bladderPressure, body.bowelPressure));
      const arousal = clamp01(body.arousalLevel + 0.2);
      const joy = clamp01(valence - 0.25 + (contextSymbols.includes('play') ? 0.1 : 0));
      return new EmotionState({ valence, arousal, joy, fear: 0, anger: 0, sadness: clamp01(0.2 - joy), surprise: 0.1 });
    };

    // Executive control (safe filter)
    const executivePropose = (events) => {
      const forbidden = new Set(['dangerous_recipes', 'personal_identifiers']);
      const candidates = events.filter(e => e.symbols.every(s => !forbidden.has(s)));
      return candidates[0] || null;
    };

    // Simulate embeddings (placeholder)
    const embedSymbols = (symbols) => {
      // Compact float vector from symbols (demo only)
      const base = symbols.join('|');
      const hash = [...base].reduce((acc, c) => acc + c.charCodeAt(0), 0);
      return [hash % 7 / 7, (hash % 13) / 13, (hash % 17) / 17, (hash % 23) / 23];
    };

    // UI state
    const ws = new GlobalWorkspace();
    let chart;

    const $ = sel => document.querySelector(sel);
    const listEl = $('#wsList');
    const emoRow = $('#emoRow');
    const renderOut = $('#renderOut');

    const readBody = () => new BodyState({
      bladderPressure: parseFloat($('#bsBladder').value),
      bowelPressure: parseFloat($('#bsBowel').value),
      nasalPatency: parseFloat($('#bsNasal').value),
      painIndex: parseFloat($('#bsPain').value),
      muscleRelaxation: parseFloat($('#bsRelax').value),
      arousalLevel: parseFloat($('#bsArousal').value),
    });

    const renderWorkspace = () => {
      const items = ws.readActive();
      listEl.innerHTML = items.map(e => `
        <div class="item">
          <div><span class="badge">${e.type}</span> <span class="badge">${e.sourceModule}</span></div>
          <div class="small mt8">Symbols: ${e.symbols.join(', ') || '(none)'}</div>
          <div class="small">Relevance: ${e.relevanceScore.toFixed(2)} • Time: ${e.timestamp}</div>
        </div>
      `).join('');
    };

    const renderEmotion = (emo) => {
      emoRow.innerHTML = `
        <span class="badge ok">valence ${emo.valence.toFixed(2)}</span>
        <span class="badge warn">arousal ${emo.arousal.toFixed(2)}</span>
        <span class="badge">joy ${emo.joy.toFixed(2)}</span>
        <span class="badge">sadness ${emo.sadness.toFixed(2)}</span>
      `;
      if (window.Chart && chart) {
        chart.data.datasets[0].data = [emo.valence, emo.arousal, emo.joy, emo.sadness];
        chart.update();
      }
    };

    const initChart = () => {
      if (!window.Chart) return;
      const ctx = document.getElementById('chart');
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Valence', 'Arousal', 'Joy', 'Sadness'],
          datasets: [{ label: 'Emotion', data: [0,0,0,0], backgroundColor: ['#3ecf8e','#ffd966','#4aa3ff','#9aa4b2'] }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 1 } } }
      });
    };

    // Actions
    $('#btnPerceive').addEventListener('click', () => {
      const syms = $('#symbols').value.split(',').map(s => s.trim()).filter(Boolean);
      const vec = embedSymbols(syms);
      const body = readBody();
      const emo = computeEmotion(body, syms);
      const ev = new CognitiveEvent({
        type: 'SENSOR',
        contentVector: vec,
        symbols: syms,
        sourceModule: 'PerceptionService',
        emotionState: emo,
        bodyState: body,
        relevanceScore: clamp01(0.5 + 0.2 * emo.valence),
        trace: ['Perception: symbols -> embedding', 'Emotion: computed from body + context']
      });
      ws.write(ev);
      renderWorkspace();
      renderEmotion(emo);
    });

    $('#btnRender').addEventListener('click', () => {
      const active = ws.readActive();
      const proposal = executivePropose(active);
      const prompt = $('#prompt').value || 'Summarize active workspace.';
      const summary = proposal
        ? `Active: ${proposal.symbols.join(', ')} (relevance ${proposal.relevanceScore.toFixed(2)})`
        : `No safe candidate; ${active.length} events present.`;
      // Safe language rendering (placeholder)
      const text = `//HEADER\nIntent: ${prompt}\nSummary: ${summary}\nPolicy: safe, neutral, no identifiers.`;
      renderOut.textContent = text;
    });

    $('#btnSeed').addEventListener('click', () => {
      $('#symbols').value = 'dog, park, play';
      $('#btnPerceive').click();
    });

    $('#btnClear').addEventListener('click', () => {
      ws.clear(); renderWorkspace(); renderEmotion(new EmotionState());
      renderOut.textContent = '';
    });

    initChart();
    renderWorkspace();
    renderEmotion(new EmotionState());
  </script>
</body>
</html>
