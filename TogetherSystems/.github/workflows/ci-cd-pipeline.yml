# ============================================================================
# CI/CD PIPELINE - GITHUB ACTIONS
# TOGETHERSYSTEMS. INTERNATIONAL TTT
# T,. CI/CD-Pipeline für vollständige Automatisierung
# ============================================================================

name: "T,. CI/CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  BRANDING: "T,.&T,,.&T,,,.T."

jobs:
  # ============================================================================
  # ENCODING CHECK
  # ============================================================================
  encoding-check:
    name: "T,. Encoding Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Encoding Lint
        run: |
          cd Fabrikage.CoreProtocols/tools
          node encoding-lint.js
      
      - name: Check HTML charset meta tags
        run: |
          grep -r '<meta charset="utf-8">' Portal/ || exit 1

  # ============================================================================
  # LINT & FORMAT
  # ============================================================================
  lint:
    name: "T,. Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Run ESLint
        run: npm run lint || true
      
      - name: Check formatting
        run: npm run format:check || true

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    name: "T,. Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Run unit tests
        run: npm run test:unit
      
      - name: Coverage report
        run: npm run test:coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    name: "T,. Integration Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Run integration tests
        run: npm run test:integration

  # ============================================================================
  # E2E TESTS
  # ============================================================================
  e2e-tests:
    name: "T,. E2E Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        run: npm run test:e2e
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # ============================================================================
  # BUILD
  # ============================================================================
  build:
    name: "T,. Build"
    runs-on: ubuntu-latest
    needs: [encoding-check, lint, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/

  # ============================================================================
  # SECURITY SCAN
  # ============================================================================
  security-scan:
    name: "T,. Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
      
      - name: Run Snyk scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # DEPLOY
  # ============================================================================
  deploy:
    name: "T,. Deploy"
    runs-on: ubuntu-latest
    needs: [build, security-scan, e2e-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: togethersystems
          directory: ./dist

  # ============================================================================
  # AUTO-FIX PIPELINE
  # ============================================================================
  auto-fix:
    name: "T,. Auto-Fix Pipeline"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run Auto-Fix Pipeline
        run: |
          cd Fabrikage.AutoExecution/pipelines
          node auto-fix.js

