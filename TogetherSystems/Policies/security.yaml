# ============================================================================
# SECURITY POLICY
# TOGETHERSYSTEMS. INTERNATIONAL TTT
# T,. Security-Policy
# ============================================================================

version: "1.0.0"
name: "T,. Security Policy"
branding: "T,.&T,,.&T,,,.T."
enforce: true
fail_fast: true

# ============================================================================
# REQUIREMENTS
# ============================================================================

requirements:
  - name: "vulnerability-scan"
    description: "T,. Regelmäßige Vulnerability-Scans"
    frequency: "on-commit"
    tools:
      - "npm-audit"
      - "snyk"
      - "dependabot"
    enforce: true
    fail_fast: true
    auto_fix: false  # Never auto-fix vulnerabilities
  
  - name: "secrets-detection"
    description: "T,. Keine Secrets im Code"
    tools:
      - "trufflehog"
      - "git-secrets"
      - "detect-secrets"
    enforce: true
    fail_fast: true
    auto_fix: false
  
  - name: "sast-scan"
    description: "T,. Static Application Security Testing"
    tools:
      - "sonarqube"
      - "semgrep"
      - "codeql"
    enforce: true
    fail_fast: true
    auto_fix: false
  
  - name: "dast-scan"
    description: "T,. Dynamic Application Security Testing"
    tools:
      - "owasp-zap"
      - "burp-suite"
    frequency: "on-deploy"
    enforce: true
    fail_fast: true
    auto_fix: false
  
  - name: "license-check"
    description: "T,. Lizenz-Compliance-Check"
    whitelist: "license-whitelist.json"
    enforce: true
    fail_fast: true
    auto_fix: false
  
  - name: "encryption"
    description: "T,. Verschlüsselung nach T,.&T,,.&T,,,.T. Prinzip"
    layers:
      - level: 1
        algorithm: "AES-256"
      - level: 2
        algorithm: "ChaCha20-Poly1305"
      - level: 3
        algorithm: "RSA-4096"
      - level: 4
        algorithm: "Elliptic Curve"
    enforce: true
    fail_fast: true
    auto_fix: false

# ============================================================================
# GATES
# ============================================================================

gates:
  - name: "no-vulnerabilities"
    required: true
    fail_fast: true
    auto_fix: false
  
  - name: "no-secrets"
    required: true
    fail_fast: true
    auto_fix: false
  
  - name: "sast-pass"
    required: true
    fail_fast: true
    auto_fix: false
  
  - name: "dast-pass"
    required: true
    fail_fast: true
    auto_fix: false
  
  - name: "license-compliance"
    required: true
    fail_fast: true
    auto_fix: false

