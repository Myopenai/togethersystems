# ============================================================================
# ACCESSIBILITY POLICY
# TOGETHERSYSTEMS. INTERNATIONAL TTT
# T,. Accessibility-Policy (WCAG AA)
# ============================================================================

version: "1.0.0"
name: "T,. Accessibility Policy"
branding: "T,.&T,,.&T,,,.T."
standard: "WCAG 2.1 Level AA"
enforce: true
fail_fast: true

# ============================================================================
# REQUIREMENTS
# ============================================================================

requirements:
  - name: "contrast-ratio"
    description: "T,. Kontrast-Verhältnis mindestens 4.5:1 für normalen Text"
    level: "AA"
    min_ratio_text: 4.5
    min_ratio_large: 3.0
    enforce: true
    auto_fix: true
  
  - name: "aria-labels"
    description: "T,. ARIA-Labels für alle interaktiven Elemente"
    level: "AA"
    required: true
    enforce: true
    auto_fix: false  # Requires review
  
  - name: "keyboard-navigation"
    description: "T,. Vollständige Tastatur-Navigation"
    level: "AA"
    required: true
    enforce: true
    auto_fix: false
  
  - name: "focus-order"
    description: "T,. Logische Fokus-Reihenfolge"
    level: "AA"
    required: true
    enforce: true
    auto_fix: false
  
  - name: "screen-reader-support"
    description: "T,. Screen-Reader-Unterstützung"
    level: "AA"
    required: true
    enforce: true
    auto_fix: false
  
  - name: "alt-text"
    description: "T,. Alt-Text für alle Bilder"
    level: "AA"
    required: true
    enforce: true
    auto_fix: false
  
  - name: "form-labels"
    description: "T,. Labels für alle Formular-Felder"
    level: "AA"
    required: true
    enforce: true
    auto_fix: false
  
  - name: "error-messages"
    description: "T,. Klare Fehlermeldungen"
    level: "AA"
    required: true
    enforce: true
    auto_fix: false

# ============================================================================
# TOOLS
# ============================================================================

tools:
  - name: "axe-core"
    version: "latest"
    level: "AA"
  
  - name: "lighthouse"
    version: "latest"
    threshold: 100
  
  - name: "pa11y"
    version: "latest"
    standard: "WCAG2AA"

# ============================================================================
# GATES
# ============================================================================

gates:
  - name: "wcag-aa-compliance"
    required: true
    fail_fast: true
    auto_fix: "policy_driven"

