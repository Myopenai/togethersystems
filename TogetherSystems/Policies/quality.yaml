# ============================================================================
# QUALITY POLICY
# TOGETHERSYSTEMS. INTERNATIONAL TTT
# T,. Quality-Policy
# ============================================================================

version: "1.0.0"
name: "T,. Quality Policy"
branding: "T,.&T,,.&T,,,.T."
enforce: true
fail_fast: true

# ============================================================================
# REQUIREMENTS
# ============================================================================

requirements:
  - name: "test-coverage"
    description: "T,. Mindestens 80% Test-Coverage"
    min_coverage: 80
    enforce: true
    fail_fast: true
    auto_fix: false
  
  - name: "lint-errors"
    description: "T,. Keine Lint-Fehler"
    max_errors: 0
    enforce: true
    fail_fast: true
    auto_fix: true
  
  - name: "complexity"
    description: "T,. Zyklomatische Komplexität max. 10"
    max_complexity: 10
    enforce: true
    fail_fast: true
    auto_fix: false
  
  - name: "duplication"
    description: "T,. Code-Duplikation max. 3%"
    max_duplication: 3
    enforce: true
    fail_fast: true
    auto_fix: false
  
  - name: "documentation"
    description: "T,. Vollständige Dokumentation"
    required: true
    enforce: true
    fail_fast: false
    auto_fix: false

# ============================================================================
# TOOLS
# ============================================================================

tools:
  - name: "jest"
    version: "latest"
    coverage: true
  
  - name: "playwright"
    version: "latest"
    coverage: true
  
  - name: "eslint"
    version: "latest"
    auto_fix: true
  
  - name: "sonarqube"
    version: "latest"
    complexity: true
    duplication: true

# ============================================================================
# GATES
# ============================================================================

gates:
  - name: "test-coverage"
    required: true
    threshold: 80
    fail_fast: true
  
  - name: "lint-errors"
    required: true
    max_errors: 0
    fail_fast: true
    auto_fix: true
  
  - name: "complexity"
    required: true
    max_complexity: 10
    fail_fast: true
  
  - name: "duplication"
    required: true
    max_duplication: 3
    fail_fast: true

# ============================================================================
# METADATA
# ============================================================================

metadata:
