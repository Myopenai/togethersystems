# ============================================================================
# FACTORY MANIFEST - SINGLE SOURCE OF TRUTH
# TOGETHERSYSTEMS. INTERNATIONAL TTT
# T,. Factory Manifest - Vollständige Konfiguration
# ============================================================================

name: "Fabrikage-Software-Production-Industrials"
version: "2.0.0-INFINITE"
branding: "T,.&T,,.&T,,,.T."
codename: "TEL1-NL-V2.0.0-INFINITE"

# ============================================================================
# PRINZIPIEN
# ============================================================================

principles:
  - privacy_by_design
  - sovereign_user
  - fail_fast_auto_fix
  - append_only_docs
  - full_provenance
  - console_heart_bypass
  - infinite_expansion

# ============================================================================
# CONSOLE BYPASS
# ============================================================================

console_bypass:
  enabled: true
  sources: [debug, problems, output, terminal, ports, playwright, build, test]
  route: "Fabrikage.ObservabilityAtlas.console.error_bus"
  principle: "Konsole ist nicht nur Beobachter, sondern Bypass: Fehler → direkt in AI-Generator → Korrektur → zurück ins Build. Kein Stop, sondern kontinuierlicher Blutfluss wie im Herz."

# ============================================================================
# AUTO-FIX
# ============================================================================

auto_fix:
  enabled: true
  strategies: [syntax, runtime, ports, accessibility, playwright, policy, performance]
  verify: [unit_tests, e2e_playwright, accessibility, perf_budgets, security_scan]
  rollback_on_fail: true
  just_in_time: true
  response_time_target: "< 1s"
  success_rate_target: "> 95%"

# ============================================================================
# DOKUMENTATION (APPEND-ONLY)
# ============================================================================

docs:
  mode: "append_only"
  autogen: true
  triggers: [build, test, fix, deploy, code_change]
  sign_and_attest: true
  history_preserved: true
  verification_required: true
  
  directories:
    main: "docs/"
    history: "docs/append_only/"
    templates: "docs/templates/"
  
  files:
    index: "docs/index.md"
    changelog: "docs/changelog.md"
    autogen: "docs/docs_autogen.md"
    policy: "docs/docs_policy.md"

# ============================================================================
# GOVERNANCE
# ============================================================================

governance:
  ethics_gates: [transparency, fairness, accessibility, data_protection, no_harm]
  compliance_required: true
  review_artifacts: true
  ethics_pass_required: true

# ============================================================================
# PROVENANCE
# ============================================================================

provenance:
  sbom: enabled
  format: "CycloneDX"
  version: "1.5"
  
  signatures: required
  algorithm: "RSA-4096"
  
  audit_clock: enabled
  precision: "second"
  timezone: "UTC"
  
  chain_of_custody: enabled
  attestations: required
  format: "SLSA"
  level: 2

# ============================================================================
# NETWORK & ONLINE
# ============================================================================

network:
  federated_error_bus: enabled
  protocol: "nats"
  retention: "24h"
  encryption: enabled
  
  port_registry: enabled
  ranges:
    app: [3000, 3999]
    services: [4000, 4999]
    tests: [5000, 5999]
  policy: "allocate_free, avoid_conflict, auto_rebind"
  
  api_gateways: enabled
  sandbox: true
  outbound_whitelist: []
  rate_limits:
    per_minute: 120
  isolation: "process"
  
  cluster_orchestration: enabled
  hosts: []
  
  online_connections: enabled
  cloud_integration: true
  database_integration: true
  global_access: true

# ============================================================================
# FABRIKAGE-MODULE
# ============================================================================

fabrikage:
  coreProtocols:
    path: "Fabrikage.CoreProtocols/"
    manifest: "Fabrikage.CoreProtocols/manifest.yaml"
    status: "PERMANENT-ACTIVE"
    mandatory: true
  
  autoExecution:
    path: "Fabrikage.AutoExecution/"
    manifest: "Fabrikage.AutoExecution/manifest.yaml"
    status: "PERMANENT-ACTIVE"
    mandatory: true
  
  intelligenceMatrix:
    path: "Fabrikage.IntelligenceMatrix/"
    manifest: "Fabrikage.IntelligenceMatrix/manifest.yaml"
    status: "PERMANENT-ACTIVE"
    mandatory: true
  
  provenanceLedger:
    path: "Fabrikage.ProvenanceLedger/"
    manifest: "Fabrikage.ProvenanceLedger/manifest.yaml"
    status: "PERMANENT-ACTIVE"
    mandatory: true
  
  observabilityAtlas:
    path: "Fabrikage.ObservabilityAtlas/"
    manifest: "Fabrikage.ObservabilityAtlas/manifest.yaml"
    status: "PERMANENT-ACTIVE"
    mandatory: true

# ============================================================================
# METADATA
# ============================================================================

metadata:
  created: "2025-01-15T20:37:00Z"
  updated: "2025-01-15T20:37:00Z"
