version: "1.0.0"
name: "T,. Verify Pipeline"
branding: "T,.&T,,.&T,,,.T."

# ============================================================================
# CHECKS
# ============================================================================

checks:
  - name: "accessibility"
    description: "T,. Accessibility-Check (WCAG AA)"
    steps:
      - name: "axe-core-scan"
        action: "scan"
        tool: "axe-core"
        level: "AA"
        rules:
          - contrast_min: 4.5
          - aria_required: true
          - keyboard_navigation: true
          - focus_order: true
      
      - name: "lighthouse-accessibility"
        action: "test"
        tool: "lighthouse"
        threshold: 100
    
    gates:
      - name: "wcag-aa-compliance"
        required: true
        fail_fast: true
  
  - name: "security"
    description: "T,. Security-Check"
    steps:
      - name: "vulnerability-scan"
        action: "scan"
        tool: "npm-audit"
      
      - name: "secrets-detection"
        action: "scan"
        tool: "trufflehog"
      
      - name: "sast-scan"
        action: "scan"
        tool: "sonarqube"
      
      - name: "dast-scan"
        action: "scan"
        tool: "owasp-zap"
    
    gates:
      - name: "no-vulnerabilities"
        required: true
        fail_fast: true
      
      - name: "no-secrets"
        required: true
        fail_fast: true
  
  - name: "performance"
    description: "T,. Performance-Check"
    steps:
      - name: "lighthouse-performance"
        action: "test"
        tool: "lighthouse"
        threshold: 90
        metrics:
          - fcp: "< 1.8s"
          - lcp: "< 2.5s"
          - fid: "< 100ms"
          - cls: "< 0.1"
          - tti: "< 3.8s"
      
      - name: "load-test"
        action: "test"
        tool: "k6"
        scenarios:
          - name: "normal-load"
            vus: 100
            duration: "5m"
          - name: "peak-load"
            vus: 500
            duration: "2m"
    
    gates:
      - name: "lighthouse-threshold"
        required: true
        threshold: 90
        fail_fast: true
      
      - name: "load-test-pass"
        required: true
        fail_fast: true
  
  - name: "slo_compliance"
    description: "T,. SLO/SLI-Compliance-Check"
    steps:
      - name: "check-availability"
        action: "check"
        slo:
          name: "availability"
          target: 0.999
          window: "30d"
      
      - name: "check-latency"
        action: "check"
        slo:
          name: "latency_p99"
          target: "< 500ms"
          window: "1h"
      
      - name: "check-error-rate"
        action: "check"
        slo:
          name: "error_rate"
          target: "< 0.1%"
          window: "1h"
      
      - name: "check-accessibility"
        action: "check"
        slo:
          name: "accessibility_compliance"
          target: "100%"
          window: "1d"
    
    gates:
      - name: "slo-compliance"
        required: true
        fail_fast: true

