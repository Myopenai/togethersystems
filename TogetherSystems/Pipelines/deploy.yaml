# ============================================================================
# DEPLOY PIPELINE
# TOGETHERSYSTEMS. INTERNATIONAL TTT
# T,. Deploy-Pipeline mit Blue-Green-Strategie
# ============================================================================

version: "1.0.0"
name: "T,. Deploy Pipeline"
branding: "T,.&T,,.&T,,,.T."
strategy: "blue-green"

# ============================================================================
# STAGES
# ============================================================================

stages:
  - name: "canary"
    description: "T,. Canary-Deployment mit SLO-Wächtern"
    steps:
      - name: "deploy-canary"
        action: "deploy"
        target: "canary"
        percentage: 5
      
      - name: "monitor-slo"
        action: "monitor"
        duration: "10m"
        slo:
          - name: "availability"
            target: 0.999
          - name: "latency_p99"
            target: "< 500ms"
          - name: "error_rate"
            target: "< 0.1%"
          - name: "accessibility_compliance"
            target: "100%"
    
    gates:
      - name: "slo-compliance"
        required: true
        fail_fast: true
        rollback_on_fail: true
  
  - name: "staged_rollout"
    description: "T,. Gestaffeltes Rollout"
    steps:
      - name: "deploy-25-percent"
        action: "deploy"
        target: "staging"
        percentage: 25
        wait: "5m"
      
      - name: "deploy-50-percent"
        action: "deploy"
        target: "staging"
        percentage: 50
        wait: "5m"
      
      - name: "deploy-75-percent"
        action: "deploy"
        target: "staging"
        percentage: 75
        wait: "5m"
    
    gates:
      - name: "staged-rollout-success"
        required: true
        fail_fast: true
        rollback_on_fail: true
  
  - name: "full_deployment"
    description: "T,. Vollständiges Deployment"
    steps:
      - name: "deploy-100-percent"
        action: "deploy"
        target: "production"
        percentage: 100
      
      - name: "switch-traffic"
        action: "switch"
        from: "blue"
        to: "green"
    
    gates:
      - name: "deployment-success"
        required: true
        fail_fast: true
  
  - name: "verify"
    description: "T,. Verifiziert Deployment"
    steps:
      - name: "health-check"
        action: "check"
        endpoints:
          - "/health"
          - "/ready"
          - "/live"
      
      - name: "accessibility-audit"
        action: "audit"
        tool: "axe-core"
        level: "AA"
      
      - name: "security-scan"
        action: "scan"
        tool: "owasp-zap"
      
      - name: "performance-test"
        action: "test"
        tool: "lighthouse"
        thresholds:
          - performance: 90
          - accessibility: 100
          - best_practices: 90
          - seo: 90
    
    gates:
      - name: "health-check-pass"
        required: true
        fail_fast: true
      
      - name: "accessibility-compliance"
        required: true
        level: "AA"
        fail_fast: true
      
      - name: "security-scan-pass"
        required: true
        fail_fast: true
      
      - name: "performance-thresholds"
        required: true
        fail_fast: true

# ============================================================================
# ROLLBACK
# ============================================================================

rollback:
  enabled: true
  automatic: true
  triggers:
    - error_rate > 0.05
    - availability < 0.99
    - latency_p99 > 1000
    - accessibility_regression
    - security_violation
  
  actions:
    - switch_traffic_back
    - keep_old_version
    - notify_team

