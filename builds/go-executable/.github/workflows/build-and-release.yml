name: T,. OSOTOSOS Build & Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'builds/go-executable/**'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

env:
  APP_NAME: ostosos-server
  VERSION: 1.0.0

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64
            extension: .exe
          - os: windows
            arch: arm64
            goos: windows
            goarch: arm64
            extension: .exe
          
          # macOS
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
            extension: ""
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
            extension: ""
          
          # Linux
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
            extension: ""
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
            extension: ""
          - os: linux
            arch: 386
            goos: linux
            goarch: 386
            extension: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        working-directory: builds/go-executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build/${{ matrix.os }}-${{ matrix.arch }}
          go build -ldflags="-s -w" \
            -o build/${{ matrix.os }}-${{ matrix.arch }}/${{ env.APP_NAME }}${{ matrix.extension }} \
            main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: builds/go-executable/build/${{ matrix.os }}-${{ matrix.arch }}/${{ env.APP_NAME }}${{ matrix.extension }}
          retention-days: 30

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Archive
        run: |
          mkdir -p release
          
          # Windows
          mkdir -p release/windows-amd64
          cp artifacts/${{ env.APP_NAME }}-windows-amd64/* release/windows-amd64/ 2>/dev/null || true
          
          mkdir -p release/windows-arm64
          cp artifacts/${{ env.APP_NAME }}-windows-arm64/* release/windows-arm64/ 2>/dev/null || true
          
          # macOS
          mkdir -p release/macos-amd64
          cp artifacts/${{ env.APP_NAME }}-darwin-amd64/* release/macos-amd64/ 2>/dev/null || true
          
          mkdir -p release/macos-arm64
          cp artifacts/${{ env.APP_NAME }}-darwin-arm64/* release/macos-arm64/ 2>/dev/null || true
          
          # Linux
          mkdir -p release/linux-amd64
          cp artifacts/${{ env.APP_NAME }}-linux-amd64/* release/linux-amd64/ 2>/dev/null || true
          
          mkdir -p release/linux-arm64
          cp artifacts/${{ env.APP_NAME }}-linux-arm64/* release/linux-arm64/ 2>/dev/null || true
          
          mkdir -p release/linux-386
          cp artifacts/${{ env.APP_NAME }}-linux-386/* release/linux-386/ 2>/dev/null || true
          
          # Erstelle ZIP Archive für jede Plattform
          cd release
          for dir in */; do
            zip -r "${dir%/}-${{ github.event.release.tag_name }}.zip" "$dir"
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
          body: |
            ## T,. OSOTOSOS Server Release ${{ github.event.release.tag_name }}
            
            **Verfügbar für:**
            - ✅ Windows (amd64, arm64)
            - ✅ macOS (amd64, arm64/Apple Silicon)
            - ✅ Linux (amd64, arm64, 386)
            
            **Installation:**
            - Windows: ZIP entpacken, `START-OSTOSOS.bat` ausführen
            - macOS: DMG öffnen, App in Applications ziehen
            - Linux: DEB installieren oder TAR.GZ entpacken
            
            T,.&T,,.&T,,,.T. - Together Systems
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        working-directory: builds/go-executable
        run: |
          go test ./... -v || echo "No tests found"

      - name: Build test (Linux)
        working-directory: builds/go-executable
        run: |
          go build -o test-build main.go
          ./test-build --version || echo "Version check not implemented"
          rm -f test-build

